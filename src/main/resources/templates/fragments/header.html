<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="sr">
<head th:fragment="head(pageTitle)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Mesara ERP | BI Analitika</title> <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

    <nav th:fragment="navbar" class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
            </li>
            <li class="nav-item d-none d-sm-inline-block">
                <a href="#" class="nav-link font-weight-bold">MESARA ERP v1.0</a>
            </li>
        </ul>

        <ul class="navbar-nav ml-auto d-md-none" th:if="${currentUri != null && currentUri.startsWith('/entries')}">

            <li class="nav-item" th:if="${not #lists.isEmpty(products) or editMode}">
                <a href="javascript:void(0)" onclick="document.getElementById('mainForm').submit();" class="nav-link text-success px-2">
                    <i class="fas fa-save fa-lg"></i>
                </a>
            </li>

            <li class="nav-item" th:if="${report != null && !editMode}">
                <a th:href="@{/entries(storeId=${selectedStoreId}, reportDate=${selectedDate}, edit=true)}" class="nav-link text-warning px-2">
                    <i class="fas fa-unlock-alt fa-lg"></i>
                </a>
            </li>

            <li class="nav-item" th:if="${not #lists.isEmpty(products) && !editMode}">
                <a href="javascript:void(0)" onclick="confirmFinalize()" class="nav-link text-danger px-2">
                    <i class="fas fa-flag-checkered fa-lg"></i>
                </a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>

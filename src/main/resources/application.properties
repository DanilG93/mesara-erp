spring.application.name=mesara-erp


spring.datasource.url=jdbc:mysql://localhost:3306/mesara_db?createDatabaseIfNotExist=true&serverTimezone=Europe/Belgrade
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


spring.thymeleaf.cache=false


# ===============================
# SETTINGS ZA SPRING SECURITY
# ===============================
app.admin.username=${ADMIN_USER}
app.admin.password=${ADMIN_PASS}
server.port=${SERVER_PORT}


# ===============================
# SETTINGS ZA JWT SECURITY
# ===============================
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=86400000

